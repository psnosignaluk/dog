version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release, so a bad or compromised one is usually caught first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Only update uv.lock. Raising the minimums in pyproject.toml would make the
    # oldest-dependencies CI job stop testing the versions dog claims to support.
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
