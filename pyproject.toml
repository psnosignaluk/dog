[project]
name = "dog"
version = "0.1.0"
description = "dig + ipinfo.io over UDP-only DNS with EDNS(0)"
readme = "README.md"
authors = [
    { name = "Paul Stevens", email = "ps@theblackwall.uk" }
]
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.8.0",
    "httpx>=0.28.1",
    "tomli>=2.0 ; python_full_version < '3.11'",
]

[project.scripts]
dog = "dog:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
target-version = "py310"
# Matches the existing code; only affects import wrapping, as E501 isn't enabled.
line-length = 140

[tool.ruff.lint]
# Ruff's defaults, plus:
extend-select = [
    "B905",     # zip() without strict=
    "PLC0207",  # split() when only the first part is used
    "PLR0912",  # too many branches
]
